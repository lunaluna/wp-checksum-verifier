name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# 外部 Actions はコミット SHA で固定する(行末のコメントが版). 新しい版への追従は Dependabot に任せる.
# runs-on は ubuntu-24.04 に固定する. ubuntu-latest は 2026-10-19〜11-19 に Ubuntu 26.04 へ移るため
# (actions/runner-images#14748. ライブラリ 1.3.1 と同じ対応).

jobs:
  php-syntax:
    name: PHP ${{ matrix.php }} syntax check
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.0', '8.2', '8.3' ]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none

      - name: Lint PHP files
        run: |
          find . -name '*.php' -not -path './vendor/*' -not -path './lib/*' -print0 \
            | xargs -0 -n1 php -l

  phpcs:
    name: PHPCS (WordPress-Extra / WordPress-Docs)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.1'
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Run PHPCS
        run: vendor/bin/phpcs --standard=phpcs.xml.dist

  phpstan:
    name: PHPStan (level 5)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.1'
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress

  phpunit:
    name: PHPUnit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.1'
          coverage: none
          # SourceWporgThemeTest builds real zip files with ZipArchive (v0.7 Step2).
          extensions: zip

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Run PHPUnit
        run: vendor/bin/phpunit

  composer-audit:
    name: composer audit (runtime dependencies)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies (no-dev)
        run: composer install --no-dev --prefer-dist --no-progress

      - name: Audit production dependencies for known vulnerabilities
        run: composer audit --no-dev

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: '.'
          # 開発用ファイル(配布物には含まれない)は検査対象から除外する.
          exclude-directories: '.github,.phpstan,vendor,tests,bin,lib'
          exclude-files: '.editorconfig,.gitignore,.distignore,.claude.local.md,composer.json,composer.lock,phpcs.xml.dist,phpstan.neon.dist,phpunit.xml.dist'
          # Update URI: false を維持したまま GitHub Releases から自己更新する
          # 意図的な実装(wp.org 非公開 + GitHub 自己更新方針)であり、
          # wp.org 未登録スラッグの乗っ取り防止は引き続き有効。既知の
          # false positive として無視する.
          # plugin_header_tested_up_to_not_allowed も無視する. メインファイルの
          # Tested up to は l2d-updater が更新の情報(tested)に使うため消せない
          # (2026-10-23 にユーザーが決定. 0.11 プランの項目0).
          ignore-codes: 'plugin_updater_detected,plugin_header_tested_up_to_not_allowed'
